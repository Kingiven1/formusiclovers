<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos — For Music Lovers</title>
<meta name="description" content="Photos from past For Music Lovers Dine & Vibe and Dance Party nights.">

  n.queue=[];t=b.createElement(e);t.async=!0;

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500;1,600&family=General+Sans:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --opal:#faf5ef;
    --blush:#f1d9d3;
    --jade:#3d6358;
    --jade-deep:#25392f;
    --ink:#2a2420;
    --gold:#c9a668;
    --rose:#a2555a;
    --line: rgba(61,99,88,0.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--opal); color:var(--ink);
    font-family:'General Sans', sans-serif; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 28px;}

  nav{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 28px;
    background:rgba(250,245,239,0.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  nav .brand{
    font-family:'Playfair Display',serif;font-style:italic;font-weight:600;
    font-size:1.1rem;color:var(--jade-deep);
  }
  nav .links a{
    font-family:'General Sans',sans-serif;font-size:0.75rem;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--ink); opacity:0.75;
  }
  nav .links a:hover{ opacity:1; color:var(--rose); }

  header.hero{
    padding:150px 24px 60px; text-align:center;
  }
  .eyebrow{
    font-family:'Playfair Display', serif; font-style:italic; font-weight:600;
    font-size:0.85rem; color:var(--rose);
  }
  header.hero h1{
    font-family:'Playfair Display',serif;font-style:italic;font-weight:600;
    font-size:clamp(2rem,5vw,3rem); color:var(--jade-deep); margin:10px 0 14px;
  }
  header.hero p{ color:rgba(42,36,32,0.6); max-width:480px; margin:0 auto; }

  main{ padding:0 0 100px; }
  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
  }
  @media (max-width:900px){ .gallery-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:640px){ .gallery-grid{ grid-template-columns:repeat(2,1fr); gap:10px; } }

  .g-item{
    aspect-ratio:3/4;
    overflow:hidden;
    background:var(--blush);
    position:relative;
    cursor:pointer;
  }
  .g-item img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform 0.4s ease;
  }
  .g-item:hover img{ transform:scale(1.04); }

  /* event/gallery picker cards */
  .event-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:24px;
  }
  @media (max-width:760px){ .event-grid{ grid-template-columns:1fr; } }
  .event-card{
    cursor:pointer; border:1px solid var(--line); background:#fff;
    transition:transform 0.2s, box-shadow 0.2s;
  }
  .event-card:hover{ transform:translateY(-5px); box-shadow:0 14px 30px rgba(37,57,47,0.14); }
  .event-card:hover .view-link{ color:var(--jade-deep); }
  .event-card:hover .view-link .arrow{ transform:translateX(4px); }
  .event-card .cover{
    aspect-ratio:3/4; background:var(--blush); overflow:hidden;
  }
  .event-card .cover img{ width:100%;height:100%;object-fit:contain;display:block; }
  .event-card .cover.empty{ display:flex;align-items:center;justify-content:center; color:var(--rose); font-family:'Playfair Display',serif; font-style:italic; }
  .event-card .info{ padding:20px 20px 26px; }
  .event-card .meta-badge{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Space Mono',monospace; font-size:0.68rem; letter-spacing:0.06em;
    color:var(--jade-deep); background:var(--blush);
    padding:5px 10px; margin-bottom:12px;
  }
  .event-card .meta-badge .dot{ color:var(--gold); }
  .event-card .label{
    font-family:'Playfair Display',serif;font-style:italic;font-weight:700;
    font-size:1.35rem; color:var(--jade-deep); line-height:1.2; margin-bottom:10px;
  }
  .event-card .sub-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:14px;
  }
  .event-card .photo-count{
    font-family:'General Sans',sans-serif; font-size:0.75rem; color:rgba(42,36,32,0.5);
  }
  .event-card .view-link{
    font-family:'General Sans',sans-serif; font-size:0.75rem; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--rose); display:flex; align-items:center; gap:5px; transition:color 0.2s;
  }
  .event-card .view-link .arrow{ display:inline-block; transition:transform 0.2s; }
  .city-filters{
    display:flex; flex-wrap:wrap; gap:10px; margin-bottom:32px;
  }
  .city-pill{
    font-family:'General Sans',sans-serif; font-size:0.75rem; letter-spacing:0.06em; text-transform:uppercase;
    padding:8px 16px; border:1px solid var(--jade); color:var(--jade-deep);
    cursor:pointer; background:transparent; transition:background 0.2s, color 0.2s;
  }
  .city-pill.active{ background:var(--jade); color:var(--opal); }
  .city-pill:hover{ background:rgba(61,99,88,0.1); }
  .city-pill.active:hover{ background:var(--jade-deep); }
  .back-link{
    display:inline-block; margin-bottom:24px;
    font-family:'General Sans',sans-serif; font-size:0.78rem; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--rose); cursor:pointer;
  }
  #event-grid, #gallery-grid{ display:none; }

  .state-msg{
    text-align:center; padding:80px 24px; color:rgba(42,36,32,0.55);
    font-family:'General Sans',sans-serif; font-size:0.9rem;
    display:none;
  }
  .state-msg.error{ color:var(--rose); }

  /* lightbox */
  .lightbox{
    position:fixed; inset:0; background:rgba(37,57,47,0.94);
    display:none; align-items:center; justify-content:center; z-index:100;
    padding:40px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:90vw; max-height:78vh; object-fit:contain; }
  .lightbox-close{
    position:absolute; top:24px; right:32px; color:var(--opal);
    font-family:'General Sans',sans-serif; font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase;
    cursor:pointer; border:1px solid var(--opal); padding:8px 16px;
  }
  .lightbox-actions{
    position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
    display:flex; gap:12px;
  }
  .lightbox-actions button{
    font-family:'General Sans',sans-serif; font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase;
    padding:12px 22px; border:1px solid var(--gold); background:transparent; color:var(--opal);
    cursor:pointer; display:flex; align-items:center; gap:8px; transition:background 0.2s, color 0.2s;
  }
  .lightbox-actions button:hover{ background:var(--gold); color:var(--jade-deep); }
  .lightbox-actions button svg{ width:15px; height:15px; }
  .lightbox-actions .action-msg{
    position:absolute; bottom:76px; left:50%; transform:translateX(-50%);
    color:var(--opal); font-family:'General Sans',sans-serif; font-size:0.75rem;
    opacity:0; transition:opacity 0.2s; white-space:nowrap;
  }
  .lightbox-actions .action-msg.visible{ opacity:0.85; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="brand">For Music Lovers</a>
  <div class="links"><a href="index.html">← Back to site</a></div>
</nav>

<header class="hero">
  <p class="eyebrow">Relive It</p>
  <h1 id="page-title">Photos</h1>
  <p id="page-sub">Moments from past Dine &amp; Vibe and Dance Party nights.</p>
</header>

<main class="wrap">
  <div id="back-link" class="back-link" style="display:none;">← All Galleries</div>
  <div id="city-filters" class="city-filters"></div>
  <div id="event-grid" class="event-grid"></div>
  <div id="gallery-grid" class="gallery-grid"></div>
  <div id="state-msg" class="state-msg"></div>
</main>

<div class="lightbox" id="lightbox">
  <div class="lightbox-close" id="lightbox-close">Close ✕</div>
  <img id="lightbox-img" src="" alt="">
  <div class="lightbox-actions">
    <span class="action-msg" id="action-msg"></span>
    <button id="share-btn" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      Share
    </button>
    <button id="download-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download
    </button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://erxreawwsglhrkisjuai.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Tb_oE1eF4Z8Xuf8ulFYxMw_I93LFIXd";
  const BUCKET = "event-photos";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const pageTitle = document.getElementById('page-title');
  const pageSub = document.getElementById('page-sub');
  const backLink = document.getElementById('back-link');
  const cityFilters = document.getElementById('city-filters');
  const eventGrid = document.getElementById('event-grid');
  const galleryGrid = document.getElementById('gallery-grid');
  const stateMsg = document.getElementById('state-msg');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxClose = document.getElementById('lightbox-close');
  const shareBtn = document.getElementById('share-btn');
  const downloadBtn = document.getElementById('download-btn');
  const actionMsg = document.getElementById('action-msg');

  lightboxClose.addEventListener('click', () => lightbox.classList.remove('open'));
  lightbox.addEventListener('click', e => { if(e.target === lightbox) lightbox.classList.remove('open'); });

  // Feature-detect whether this device/browser can share image files at all
  // (mobile Safari/Chrome generally yes, most desktop browsers no — this is
  // an OS-level capability, not something a website can add where it's missing).
  let canShareFiles = false;
  try {
    const testFile = new File(['x'], 'test.jpg', { type: 'image/jpeg' });
    canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [testFile] }));
  } catch(e) {
    canShareFiles = false;
  }
  if(canShareFiles){ shareBtn.style.display = 'flex'; }

  function showActionMsg(text){
    actionMsg.textContent = text;
    actionMsg.classList.add('visible');
    setTimeout(() => actionMsg.classList.remove('visible'), 2200);
  }

  let currentPhotoUrl = '';
  let currentPhotoName = 'for-music-lovers-photo.jpg';

  async function fetchAsFile(url, filename){
    const response = await fetch(url);
    const blob = await response.blob();
    return new File([blob], filename, { type: blob.type || 'image/jpeg' });
  }

  shareBtn.addEventListener('click', async () => {
    if(!currentPhotoUrl) return;
    try {
      const file = await fetchAsFile(currentPhotoUrl, currentPhotoName);
      await navigator.share({
        files: [file],
        title: 'For Music Lovers',
        text: 'From a For Music Lovers night ✨ @thisisformusiclovers'
      });
    } catch(err) {
      // AbortError just means they closed the share sheet — not a real failure
      if(err.name !== 'AbortError'){
        console.error('Share failed:', err);
        showActionMsg("Couldn't open share — try downloading instead");
      }
    }
  });

  downloadBtn.addEventListener('click', async () => {
    if(!currentPhotoUrl) return;
    try {
      const response = await fetch(currentPhotoUrl);
      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = currentPhotoName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(blobUrl);
      showActionMsg('Downloaded');
    } catch(err) {
      console.error('Download failed:', err);
      window.open(currentPhotoUrl, '_blank');
    }
  });

  function openLightbox(url, filename){
    currentPhotoUrl = url;
    currentPhotoName = filename;
    lightboxImg.src = url;
    lightbox.classList.add('open');
  }

  function labelize(slug){
    return slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  // Folder format: YYYY-MM-DD__city-slug__event-name-slug
  function parseFolderName(folderName){
    const [date, citySlug, ...nameParts] = folderName.split('__');
    const nameSlug = nameParts.join('__');
    // Fallback for any older folders created before city/date existed
    if(!citySlug || !nameSlug){
      return { date: '', city: '', name: labelize(folderName), raw: folderName };
    }
    return { date, city: labelize(citySlug), name: labelize(nameSlug), raw: folderName };
  }

  function formatDate(isoDate){
    if(!isoDate) return '';
    const d = new Date(isoDate + 'T00:00:00');
    if(isNaN(d)) return '';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function getEventParam(){
    return new URLSearchParams(window.location.search).get('event');
  }

  function showEvent(slug){
    window.location.href = `gallery.html?event=${encodeURIComponent(slug)}`;
  }

  let allEvents = [];
  let activeCity = 'all';

  function renderEventGrid(){
    eventGrid.innerHTML = '';
    const filtered = activeCity === 'all'
      ? allEvents
      : allEvents.filter(ev => ev.city === activeCity);

    if(filtered.length === 0){
      stateMsg.textContent = "No galleries for that city yet.";
      stateMsg.style.display = 'block';
      return;
    }
    stateMsg.style.display = 'none';

    filtered.forEach(ev => {
      const card = document.createElement('div');
      card.className = 'event-card';
      const metaText = [formatDate(ev.date), ev.city].filter(Boolean).join(' <span class="dot">•</span> ');
      const countText = ev.photoCount === 1 ? '1 photo' : `${ev.photoCount} photos`;
      card.innerHTML = `
        <div class="cover ${ev.cover ? '' : 'empty'}">
          ${ev.cover ? `<img src="${ev.cover}" alt="${ev.name}" loading="lazy">` : 'No photos yet'}
        </div>
        <div class="info">
          ${metaText ? `<div class="meta-badge">${metaText}</div>` : ''}
          <div class="label">${ev.name}</div>
          <div class="sub-row">
            <span class="photo-count">${countText}</span>
            <span class="view-link">View Gallery <span class="arrow">→</span></span>
          </div>
        </div>
      `;
      card.addEventListener('click', () => showEvent(ev.raw));
      eventGrid.appendChild(card);
    });
  }

  function renderCityFilters(){
    const cities = Array.from(new Set(allEvents.map(ev => ev.city).filter(Boolean))).sort();
    if(cities.length <= 1){
      cityFilters.style.display = 'none';
      return;
    }
    cityFilters.innerHTML = '';
    const allPill = document.createElement('button');
    allPill.className = 'city-pill active';
    allPill.textContent = 'All Cities';
    allPill.addEventListener('click', () => setActiveCity('all', allPill));
    cityFilters.appendChild(allPill);

    cities.forEach(city => {
      const pill = document.createElement('button');
      pill.className = 'city-pill';
      pill.textContent = city;
      pill.addEventListener('click', () => setActiveCity(city, pill));
      cityFilters.appendChild(pill);
    });
  }

  function setActiveCity(city, clickedPill){
    activeCity = city;
    cityFilters.querySelectorAll('.city-pill').forEach(p => p.classList.remove('active'));
    clickedPill.classList.add('active');
    renderEventGrid();
  }

  async function loadEventList(){
    eventGrid.style.display = 'grid';
    galleryGrid.style.display = 'none';
    backLink.style.display = 'none';
    pageTitle.textContent = 'Photos';
    pageSub.textContent = 'Pick a night to relive it.';

    const { data, error } = await sb.storage.from(BUCKET).list('', { limit: 100 });
    if(error){
      stateMsg.textContent = "Couldn't load galleries right now — try again shortly.";
      stateMsg.classList.add('error');
      stateMsg.style.display = 'block';
      return;
    }

    const folders = (data || []).filter(item => item.id === null);
    if(folders.length === 0){
      stateMsg.textContent = "No galleries yet — check back after the next event.";
      stateMsg.style.display = 'block';
      return;
    }

    const events = [];
    for(const folder of folders){
      const parsed = parseFolderName(folder.name);
      // Fetch all files in this gallery so we can check for a manually-chosen cover
      // (any file renamed to start with "cover-" in the Supabase dashboard wins).
      const { data: files } = await sb.storage.from(BUCKET).list(folder.name, {
        limit: 200, sortBy: { column: 'created_at', order: 'desc' }
      });
      let coverFile = null;
      if(files && files.length > 0){
        coverFile = files.find(f => f.name.toLowerCase().startsWith('cover-')) || files[0];
      }
      const cover = coverFile
        ? sb.storage.from(BUCKET).getPublicUrl(`${folder.name}/${coverFile.name}`).data.publicUrl
        : null;
      const photoCount = files ? files.length : 0;
      events.push({ ...parsed, cover, photoCount });
    }

    // Newest first; folders without a valid date sort to the end
    events.sort((a, b) => {
      if(!a.date) return 1;
      if(!b.date) return -1;
      return b.date.localeCompare(a.date);
    });

    allEvents = events;
    renderCityFilters();
    renderEventGrid();
  }

  async function loadEventPhotos(slug){
    eventGrid.style.display = 'none';
    galleryGrid.style.display = 'grid';
    cityFilters.style.display = 'none';
    backLink.style.display = 'inline-block';
    backLink.addEventListener('click', () => { window.location.href = 'gallery.html'; });

    const parsed = parseFolderName(slug);
    pageTitle.textContent = parsed.name;
    pageSub.textContent = [formatDate(parsed.date), parsed.city].filter(Boolean).join(' · ') || 'Tap a photo to enlarge it.';

    const { data, error } = await sb.storage.from(BUCKET).list(slug, {
      limit: 200, sortBy: { column: 'created_at', order: 'desc' }
    });

    if(error){
      stateMsg.textContent = "Couldn't load this gallery right now — try again shortly.";
      stateMsg.classList.add('error');
      stateMsg.style.display = 'block';
      return;
    }

    const images = (data || []).filter(f => f.id !== null);
    if(images.length === 0){
      stateMsg.textContent = "No photos in this gallery yet.";
      stateMsg.style.display = 'block';
      return;
    }

    images.forEach((file, index) => {
      const url = sb.storage.from(BUCKET).getPublicUrl(`${slug}/${file.name}`).data.publicUrl;
      const downloadName = `for-music-lovers-${slug}-${index + 1}.jpg`;
      const item = document.createElement('div');
      item.className = 'g-item';
      const img = document.createElement('img');
      img.src = url;
      img.alt = 'For Music Lovers event photo';
      img.loading = 'lazy';
      img.addEventListener('click', () => openLightbox(url, downloadName));
      item.appendChild(img);
      galleryGrid.appendChild(item);
    });
  }

  const eventSlug = getEventParam();
  if(eventSlug){
    loadEventPhotos(eventSlug);
  } else {
    loadEventList();
  }
</script>

</body>
</html>
